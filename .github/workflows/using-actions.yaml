name: using actions

on: 
  #push
  workflow_dispatch

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: Using-Actions-gh-actions/react-app
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            - name: Setup NodeJS  
              uses: actions/setup-node@v7
              with:
                node-version: '26.x'
            - name: installing dependencies
              run: npm ci
            - name: Unit Testing
              run: npm run test