name: using actions

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            - name: Setup NodeJS  
              uses: actions/setup-node@v7
              with:
                node-version: '26.x'
            - name: installing dependencies
              run: npm ci
              working-directory: Using-Actions-gh-actions/react-app