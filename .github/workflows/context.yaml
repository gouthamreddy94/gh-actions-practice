name: github context
run-name: context | DEBUG -- ${{inputs.debug}}

on: 
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

env:
    MY_WORKFLOW_VAR: 'workflow'
    MY_OVERWRITTEN_VAR: 'workflow'

jobs:
    echo-data:
        runs-on: ubuntu-latest
        env:
            MY_JOB_VAR: 'job'
            MY_OVERWRITTEN_VAR: 'job'
        steps:
            - name: dispaly information
              run: |
                echo "Event Name: ${{github.event_name}}"
                echo "Ref: ${{github.ref}}"
                echo "SHA: ${{github.sha}}"
            - name: Retrieve variable
              run: |
                echo "variable data: ${{vars.MY_INFO}}"
            - name: Print Env variable
              run: |
                echo "Workflow Env: ${{env.MY_WORKFLOW_VAR}}"
                echo "Overwitten Env: ${{env.MY_OVERWRITTEN_VAR}}"
            - name: Print Env variable
              env:
                MY_OVERWRITTEN_VAR: 'step'
              run: |
                echo "Workflow Env: ${{env.MY_WORKFLOW_VAR}}"
                echo "Overwitten Env: ${{env.MY_OVERWRITTEN_VAR}}"
    echo-data2:
        runs-on: ubuntu-latest
        steps:
            - name: Print Env variables
              run: |
                echo "Workflow Env: $MY_WORKFLOW_VAR"
                echo "Overwitten Env: $MY_OVERWRITTEN_VAR"
